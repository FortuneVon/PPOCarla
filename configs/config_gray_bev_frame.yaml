defaults:
  - config
async_env: true
wandb: 
  use: true
  project: 'PPOCarla'
  entity: 'fq_whu-tokyo-tech'
docker: false
setup:
  device_learning: 'cuda:0' # 'cuda:0' / 'cpu'
  host_gpus: [ 0 ] # single-gpu [0]
  docker_base_port: 56000
  load_checkpoint:
    use: false  # 初次训练，一定是 false！
    # use: true
    # dir: outputs/2025-05-01/23-31-02/wandb/run-20250501_233103-lz2giihw/files
    # # outputs/2025-05-01/23-31-02/wandb/run-20250501_233103-lz2giihw/files/agent_llm_256000.pt
    # model_name: agent_llm_256000.pt
llm:
  use: false
  # use: true
  # reward_update_freq: 2000
viz:
  render_off_screen: true # pygame + carla rendering offscreen
  pygame_rendering: false # pygame rendering
  carla_no_rendering: true # no carla rendering
env:
  sensors:
    main_modality: rgb_bev # rgb_bev / multi_bev / rgb
    size_output_image: 128  # size of the image
rl:
  # total_timesteps: 1e6  # total timesteps of the experiments
  total_timesteps: 1e9
  actor:
    fc_arch: [ 256, [ 256, 1 ] ]
  critic:
    fc_arch: [ 256, [ 256, 1 ] ]
  lstm:
    use: false
  image:
    type: 'custom'
    grayscale: true
    load_pretrained: false
    pool_first: false
    pool_last: false
    conv_arch: [
      [ 3, 32, 8, 4, 0 ],
      [ 32, 64, 4, 2, 0 ],
      [ 64, 64, 3, 2, 0 ],
    ]
  frame_stack:
    use: true
